name: Import pvr.satip release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: pvr.satip release tag to import, for example v0.1.1-omega
        required: true
      feed:
        description: Kodi feed to update
        required: true
        default: omega
        type: choice
        options:
          - omega
          - piers
  repository_dispatch:
    types:
      - pvr-satip-release

permissions:
  contents: write

# Serialize writers on the same branch so Omega and Piers imports cannot overwrite
# each other's generated repository index or installation ZIP.
concurrency:
  group: bg-repository-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve import inputs
        shell: pwsh
        run: |
          $releaseTag = '${{ github.event.client_payload.release_tag }}'
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = '${{ inputs.release_tag }}'
          }
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            throw 'No release tag was provided.'
          }

          $feed = '${{ github.event.client_payload.feed }}'
          if ([string]::IsNullOrWhiteSpace($feed)) {
            $feed = '${{ inputs.feed }}'
          }
          if ([string]::IsNullOrWhiteSpace($feed)) {
            $feed = 'omega'
          }
          if ($feed -notin @('omega', 'piers')) {
            throw "Unsupported feed '$feed'."
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FEED=$feed" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import pvr.satip assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PVR_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Missing repository secret PVR_RELEASE_TOKEN. It must be able to read blauesgruen/pvr.satip releases.'
          }
          .\scripts\import-github-release.ps1 -Repository blauesgruen/pvr.satip -ReleaseTag $env:RELEASE_TAG -FeedPath $env:FEED

      - name: Validate repository packages
        shell: pwsh
        run: .\scripts\validate-repository.ps1

      - name: Build repository metadata
        shell: pwsh
        run: .\scripts\build-repository.ps1

      - name: Validate repository add-on and feed indexes
        shell: pwsh
        run: .\scripts\validate-repository-addon.ps1

      - name: Commit updated repository files
        shell: pwsh
        run: |
          git fetch origin
          git pull --rebase --autostash origin $env:GITHUB_REF_NAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Building the repository generates metadata for BOTH feeds.
          git add -- omega piers repository.bg
          if (git diff --cached --quiet) {
            Write-Host 'No repository changes to commit.'
            exit 0
          }
          git commit -m "Update pvr.satip $env:RELEASE_TAG ($env:FEED)"
          git push
